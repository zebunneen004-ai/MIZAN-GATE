[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-gate"
version = "0.1.0.dev0"
description = "Decision-time graph assurance research for anti-money-laundering systems"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "zebunneen004-ai"}]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
